name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest fastapi httpx psycopg2-binary websockets python-dotenv python-multipart

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile all services
        run: python -m py_compile fleet-backend/*.py receiver/*.py runner/*.py channels-mcp/*.py

      - name: Tests (pytest)
        run: pytest -q
